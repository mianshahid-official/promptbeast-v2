[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "promptbeast"
version = "1.0.0"
description = "Story-to-Image Prompt & Narration Timeline Studio"
readme = "README.md"
authors = [{ name = "PromptBeast Team" }]
dependencies = [
    "PySide6>=6.6.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.7.0",
    "httpx>=0.27.0",
    "modal>=0.60.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
